<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Personajes</title>
</head>
<body>

<h1>Lista de Personajes</h1>

<table border="1">
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Clase</th>
        <th>Nivel</th>
        <th>Vida</th>
    </tr>
    </thead>

    <tbody>
    {% for p in personajes %}
    <tr>
        <td>{{ p.nombre }}</td>
        <td>{{ p.clase }}</td>
        <td>{{ p.nivel }}</td>
        <td>{{ p.vida }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
    <h2>Crear nuevo personaje</h2>

    <form action="/personajes" method="POST">


        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>

        <br><br>

        <label for="clase">Clase:</label>
        <input type="text" id="clase" name="clase" required>

        <br><br>

        <label for="nivel">Nivel:</label>
        <input type="number" id="nivel" name="nivel" min="1" required>

        <br><br>

        <label for="vida">vida:</label>
        <input type="number" id="vida" name="vida" min="1" required>
        <br><br>
        <button type="submit">Guardar</button>


    </form>



</body>
</html>
